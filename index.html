<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top Bar ── */
  .topbar {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #e9edef;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }
  .topbar-hamburger span {
    width: 22px;
    height: 2px;
    background: #54656f;
    border-radius: 2px;
    display: block;
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .topbar-brand svg { width: 28px; height: 28px; }
  .topbar-brand-name {
    font-size: 20px;
    font-weight: 600;
    color: #111;
    letter-spacing: -0.3px;
  }

  .topbar-download {
    width: 36px;
    height: 36px;
    border: 2px solid #25d366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .topbar-download:hover { background: #e8fdf2; }
  .topbar-download svg { width: 18px; height: 18px; }

  /* ── Main Content ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 24px;
  }

  /* ── Profile Card ── */
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px 28px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .avatar-wrap {
    position: relative;
    margin-bottom: 18px;
  }
  .avatar-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #25d366;
    overflow: hidden;
  }
  .avatar-circle svg {
    width: 62px;
    height: 62px;
  }
  .online-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 14px;
    height: 14px;
    background: #25d366;
    border-radius: 50%;
    border: 2px solid #fff;
  }

  .username {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }

  .tagline {
    font-size: 14px;
    color: #8696a0;
    margin-bottom: 24px;
    text-align: center;
  }

  .btn-chat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #25d366;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    width: 100%;
    max-width: 260px;
    text-decoration: none;
    transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 2px 12px rgba(37,211,102,0.25);
    letter-spacing: 0.1px;
  }
  .btn-chat:hover {
    background: #1ebe5d;
    box-shadow: 0 4px 20px rgba(37,211,102,0.38);
    transform: translateY(-1px);
  }
  .btn-chat:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(37,211,102,0.2);
  }
  .btn-chat svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ── Follow Us ── */
  .follow-section {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }

  .follow-label {
    font-size: 12px;
    font-weight: 600;
    color: #8696a0;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .social-icons {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    text-decoration: none;
  }
  .social-btn:hover { transform: scale(1.08); background: #222; }
  .social-btn svg { width: 22px; height: 22px; fill: #fff; }

  /* ── Footer ── */
  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 32px 16px 24px;
    margin-top: auto;
  }

  .footer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .footer-brand svg { width: 36px; height: 36px; }
  .footer-brand-name {
    font-size: 24px;
    font-weight: 700;
    color: #25d366;
    letter-spacing: -0.5px;
  }

  .footer-legal {
    font-size: 12px;
    color: #8696a0;
    text-align: center;
  }
  .footer-legal a {
    color: #8696a0;
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer-legal a:hover { color: #25d366; }
  .footer-legal .sep { margin: 0 5px; }
</style>
</head>
